{% extends 'incidentes/base.html' %}

{% block title %}Nuevo Incidente - SGI UTO{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header p-3">
                <h5 class="mb-0">Reportar Nuevo Incidente</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ form.titulo.label }}</label>
                        {{ form.titulo }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ form.descripcion.label }}</label>
                        {{ form.descripcion }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ form.categoria.label }}</label>
                        {{ form.categoria }}
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">{{ form.impacto.label }}</label>
                            {{ form.impacto }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">{{ form.urgencia.label }}</label>
                            {{ form.urgencia }}
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Crear Incidente</button>
                        <a href="{% url 'lista_incidentes' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
